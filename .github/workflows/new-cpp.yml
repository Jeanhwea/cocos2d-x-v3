name: cpp

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-macos:
    strategy:
      matrix:
        os:
          - macos-15-intel
        arch:
          - x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup cocos2d-x Environment
        run: |
          python3 --version
          echo "" | python3 setup.py

      - name: Initialize Project
        run: |
          source /Users/runner/.bash_profile
          echo "N" | cocos new -l cpp aaa

      - name: Setup Project
        run: |
          cd aaa
          cmake -B build -G"Xcode" --log-level=STATUS

      - name: Build Project
        run: |
          cd aaa
          cmake --build build --config Release

  test-windows:
    strategy:
      matrix:
        os:
          - windows-2022
        arch:
          - x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup cocos2d-x Environment
        run: |
          python3 --version
          echo "" | python3 setup.py

      - name: Initialize Project
        run: |
          # Add cocos2d-x Environments
          $env:PATH = "D:\a\cocos2d-x-v3\cocos2d-x-v3\tools\cocos2d-console\bin;$env:PATH"
          $env:COCOS_CONSOLE_ROOT = "D:\a\cocos2d-x-v3\cocos2d-x-v3\tools\cocos2d-console\bin"
          $env:COCOS_X_ROOT = "D:\a\cocos2d-x-v3"
          $env:COCOS_TEMPLATES_ROOT = "D:\a\cocos2d-x-v3\cocos2d-x-v3\templates"

          echo "N" | cocos new -l cpp aaa

      - name: Setup Project
        run: |
          cd aaa
          cmake -B build -G"Visual Studio 17 2022" -A win32 --log-level=STATUS

      - name: Build Project
        run: |
          cd aaa
          cmake --build build --config Release
